# Starship Prompt Configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for starship to scan files (milliseconds)
scan_timeout = 30
command_timeout = 500

# One prompt per line, no blank line between them.
add_newline = false

# Active modus palette. Switched by theme-mode(1), which for light mode points
# STARSHIP_CONFIG at a generated copy of this file with this one line rewritten
# -- starship cannot select a palette from the environment.
palette = "modus_dark"

# One line, no frame: where am I, what branch, is it dirty, prompt.
# username/hostname only surface over SSH or as root (see their modules).
format = """$username$hostname$directory$git_branch$git_status$git_state$character"""

# Right side: only things that are worth knowing after the fact.
right_format = """$cmd_duration$python"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname](bold yellow) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
min_time = 2000
format = "[$duration](bright-black) "

[python]
symbol = ""
style = "bright-black"
format = '[($virtualenv)]($style) '

[time]
disabled = true

# Modus palettes. Every value is the colour Neovim actually renders for the
# matching highlight group under modus_vivendi (tinted) / modus_operandi, read
# out of nvim_get_hl -- the same source the fish and tmux themes use.
#
# These deliberately shadow starship's built-in colour names, which is why not
# one style string above had to change: "bold green" now resolves to the modus
# green rather than ANSI 32.

[palettes.modus_dark]
green = "#00c06f"           # DiagnosticOk
red = "#ff7f9f"             # DiagnosticError
blue = "#79a8ff"            # Keyword
cyan = "#4ae2f0"            # Identifier
yellow = "#dfaf7a"          # DiagnosticWarn
purple = "#b6a0ff"          # Statement
"bright-black" = "#989898"  # NonText

[palettes.modus_light]
green = "#00663f"
red = "#a0132f"
blue = "#0031a9"
cyan = "#005e8b"
yellow = "#7a4f2f"
purple = "#531ab6"
"bright-black" = "#595959"
