# Starship Prompt Configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for starship to scan files (milliseconds)
scan_timeout = 30
# Generous on purpose. A tmux restore starts every pane's shell in the same
# second, and git under that contention overshot 500ms -- starship then
# printed a "timed out" WARN into each restored pane. The prompt still renders
# as soon as git answers; this only bounds the pathological case.
command_timeout = 2000

# One prompt per line, no blank line between them.
add_newline = false

# Active palette (Kanagawa, matching Ghostty). Switched by theme-mode(1), which for light mode points
# STARSHIP_CONFIG at a generated copy of this file with this one line rewritten
# -- starship cannot select a palette from the environment.
palette = "kanagawa_dark"

# One line, no frame: where am I, what branch, is it dirty, prompt.
# username/hostname only surface over SSH or as root (see their modules).
format = """$username$hostname$directory$git_branch$git_status$git_state$character"""

# Right side: only things that are worth knowing after the fact.
right_format = """$cmd_duration$python"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style)"
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname](bold yellow) "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
min_time = 2000
format = "[$duration](bright-black) "

[python]
symbol = ""
style = "bright-black"
format = '[($virtualenv)]($style) '

[time]
disabled = true

# Kanagawa palettes. Every value is the colour Neovim actually renders for the
# matching highlight group under kanagawa-wave / kanagawa-lotus, read out of
# nvim_get_hl -- the same source the tmux themes use.
#
# These deliberately shadow starship's built-in colour names, which is why not
# one style string above had to change: "bold green" now resolves to the
# kanagawa green rather than ANSI 32.

[palettes.kanagawa_dark]
green = "#98bb6c"           # DiagnosticOk
red = "#e82424"             # DiagnosticError
blue = "#7e9cd8"            # Function
cyan = "#7fb4ca"            # Special
yellow = "#e6c384"          # Identifier
purple = "#957fb8"          # Keyword
"bright-black" = "#727169"  # Comment

[palettes.kanagawa_light]
green = "#6f894e"
red = "#c84053"
blue = "#4d699b"
cyan = "#6693bf"
yellow = "#77713f"
purple = "#624c83"
"bright-black" = "#8a8980"
