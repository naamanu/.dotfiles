# kanagawa-wave for tmux -- sourced by ~/.tmux.conf according to the shared theme
# mode, and re-sourced by theme-mode(1) when the mode changes. Matches Ghostty's
# "Kanagawa Wave" and Neovim's kanagawa family.
#
# Hexes are the colours Neovim renders for the matching groups under
# kanagawa-wave, read out of nvim_get_hl -- the same source as starship.
#   bg-dim #16161d (StatusLine)  bg-active #2d4f67 (PmenuSel)  border #54546d (LineNr)
#   fg-main #dcd7ba  fg-dim #727169 (Comment)  accent #7e9cd8 (Function)  red #e82424

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#16161d,fg=#727169'

# Session name, doubling as the prefix indicator: the block turns red while the
# prefix is held.
set -g status-left-length 40
set -g status-left '#[fg=#1f1f28,bg=#{?client_prefix,#e82424,#7e9cd8},bold] #S #[fg=#54546d,bg=#16161d]│ '

# The current window carries a background AND an accent edge: background alone
# was easy to lose at a glance across a wide bar.
set -g window-status-separator ''
set -g window-status-format '#[fg=#727169]#I #W  '
set -g window-status-current-format '#[fg=#7e9cd8,bg=#2d4f67]▎#[fg=#dcd7ba,bg=#2d4f67,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#727169,bg=#16161d]  '
set -g window-status-activity-style 'fg=#ff9e3b,none'
set -g window-status-bell-style 'fg=#e82424,bold'

set -g status-right-length 60
set -g status-right '#[fg=#54546d]│ #[fg=#727169]%a %d %b  #[fg=#dcd7ba,bold]%H:%M '

set -g pane-border-style 'fg=#54546d'
set -g pane-active-border-style 'fg=#7e9cd8'
set -g message-style 'bg=#2d4f67,fg=#dcd7ba,bold'
set -g mode-style 'bg=#2d4f67,fg=#dcd7ba'
set -g display-panes-colour '#54546d'
set -g display-panes-active-colour '#7e9cd8'
