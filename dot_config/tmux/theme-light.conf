# Monokai for tmux (light mode too: Ghostty runs Monokai Classic in both modes
# and Neovim is pinned to the dark unokai) -- sourced by ~/.tmux.conf according
# to the shared theme mode, and re-sourced by theme-mode(1) when it changes.
#
# Hexes follow Ghostty's "Monokai Classic" and Neovim's unokai.
#   bg-dim #1e1f1c  bg-active #49483e  border #75715e
#   fg-main #f8f8f2  fg-dim #a59f85  accent #66d9ef  red #f92672

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#1e1f1c,fg=#a59f85'

# Session name, doubling as the prefix indicator: the block turns red while the
# prefix is held.
set -g status-left-length 40
set -g status-left '#[fg=#272822,bg=#{?client_prefix,#f92672,#66d9ef},bold] #S #[fg=#75715e,bg=#1e1f1c]│ '

# The current window carries a background AND an accent edge: background alone
# was easy to lose at a glance across a wide bar.
set -g window-status-separator ''
set -g window-status-format '#[fg=#a59f85]#I #W  '
set -g window-status-current-format '#[fg=#66d9ef,bg=#49483e]▎#[fg=#f8f8f2,bg=#49483e,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#a59f85,bg=#1e1f1c]  '
set -g window-status-activity-style 'fg=#fd971f,none'
set -g window-status-bell-style 'fg=#f92672,bold'

set -g status-right-length 60
set -g status-right '#[fg=#75715e]│ #[fg=#a59f85]%a %d %b  #[fg=#f8f8f2,bold]%H:%M '

set -g pane-border-style 'fg=#75715e'
set -g pane-active-border-style 'fg=#66d9ef'
set -g message-style 'bg=#49483e,fg=#f8f8f2,bold'
set -g mode-style 'bg=#49483e,fg=#f8f8f2'
set -g display-panes-colour '#75715e'
set -g display-panes-active-colour '#66d9ef'
