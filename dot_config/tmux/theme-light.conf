# kanagawa-lotus for tmux -- sourced by ~/.tmux.conf according to the shared theme
# mode, and re-sourced by theme-mode(1) when the mode changes. Matches Ghostty's
# "Kanagawa Lotus" and Neovim's kanagawa family.
#
# Hexes are the colours Neovim renders for the matching groups under
# kanagawa-lotus, read out of nvim_get_hl -- the same source as starship.
#   bg-dim #d5cea3 (StatusLine)  bg-active #9fb5c9 (PmenuSel)  border #a09cac (LineNr)
#   fg-main #1f1f28  fg-dim #545464 (Normal)  accent #4d699b (Function)  red #c84053

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=#d5cea3,fg=#545464'

# Session name, doubling as the prefix indicator: the block turns red while the
# prefix is held.
set -g status-left-length 40
set -g status-left '#[fg=#f2ecbc,bg=#{?client_prefix,#c84053,#4d699b},bold] #S #[fg=#a09cac,bg=#d5cea3]│ '

# The current window carries a background AND an accent edge: background alone
# was easy to lose at a glance across a wide bar.
set -g window-status-separator ''
set -g window-status-format '#[fg=#545464]#I #W  '
set -g window-status-current-format '#[fg=#4d699b,bg=#9fb5c9]▎#[fg=#1f1f28,bg=#9fb5c9,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#545464,bg=#d5cea3]  '
set -g window-status-activity-style 'fg=#e98a00,none'
set -g window-status-bell-style 'fg=#c84053,bold'

set -g status-right-length 60
set -g status-right '#[fg=#a09cac]│ #[fg=#545464]%a %d %b  #[fg=#1f1f28,bold]%H:%M '

set -g pane-border-style 'fg=#a09cac'
set -g pane-active-border-style 'fg=#4d699b'
set -g message-style 'bg=#9fb5c9,fg=#1f1f28,bold'
set -g mode-style 'bg=#9fb5c9,fg=#1f1f28'
set -g display-panes-colour '#a09cac'
set -g display-panes-active-colour '#4d699b'
