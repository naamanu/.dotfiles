# -- terminal & display --------------------------------------------------------

# True colour. tmux 3.2 moved this to terminal-features; the older
# `terminal-overrides ,<term>:RGB` idiom is silently ignored -- measured on
# tmux 3.4, no override form sets the terminal's RGB flag, an exact TERM match
# included. Ghostty's terminfo advertises Tc and setrgbf but not RGB, so tmux
# will not work it out on its own either.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# Undercurl (LSP diagnostic squiggles in Neovim), strikethrough, and the
# extended-keys protocol are terminal features on tmux >= 3.3, so they are
# declared rather than spelled out as escape sequences.
set -as terminal-features ",xterm-ghostty:usstyle:strikethrough:extkeys:osc7"
set -as terminal-features ",xterm-256color:usstyle:strikethrough"

# Distinguish C-S-<key>, C-., S-Enter and friends inside tmux. Ghostty speaks
# the CSI u protocol; without this every such chord collapses to its plain
# form before Neovim or Emacs ever sees it.
set -s extended-keys on

# Let image protocols and other OSC passthrough (image.nvim, snacks.image,
# progress bars) reach the outer terminal instead of being swallowed.
set -g allow-passthrough on

# -- general options -----------------------------------------------------------

set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
set -s escape-time 0
set -g mouse on

# Send copies to the outer terminal's clipboard via OSC52 as well. Locally
# tmux-yank already pipes to xsel; this is what makes yanking work when tmux is
# running on the far end of an SSH connection, where xsel cannot reach back.
set -g set-clipboard on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Activity alerts
setw -g monitor-activity on
set -g visual-activity off

# -- prefix key ----------------------------------------------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- keybindings ---------------------------------------------------------------

bind R source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# Splits (in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom. Deliberately not -r: it is a toggle, so a second press inside
# repeat-time would just undo it.
bind m resize-pane -Z

# Window navigation
bind -r p previous-window
bind -r n next-window

# -- copy mode -----------------------------------------------------------------

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- plugins -------------------------------------------------------------------

# tmux-sensible is deliberately absent: everything it sets is either
# explicit above or a tmux 3.x default.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# -- theme ---------------------------------------------------------------------

# The palette lives in ~/.config/tmux/theme-{dark,light}.conf and is chosen from
# the mode theme-mode(1) writes, so a server started while the desktop is light
# comes up light. theme-mode re-sources this file when the mode changes.
# Anything unrecognised falls back to dark rather than sourcing a missing file.
run-shell 'm=$(cat "${XDG_STATE_HOME:-$HOME/.local/state}/theme-mode" 2>/dev/null); [ "$m" = light ] || m=dark; tmux source-file "$HOME/.config/tmux/theme-$m.conf"'

# -- plugin settings -----------------------------------------------------------

# Resurrect + continuum: sessions are saved every 15 minutes and restored
# when the server starts, so C-a C-s / C-a C-r are only for manual points.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# -- neovim integration -------------------------------------------------------

# C-h/j/k/l pane navigation that passes through to Neovim's window commands is
# provided by vim-tmux-navigator (declared above), together with its Neovim-side
# plugin. Both halves are needed: without the Neovim side, C-h in the leftmost
# window is swallowed by Neovim and focus never returns to the tmux pane.
# It also binds C-\ for the previously active pane.

# Resizing: M-h/j/k/l. Unconditional on purpose. Neovim binds no M- keys, so the
# old if-shell passthrough sent them into Neovim to be discarded, which meant
# panes could not be resized at all while Neovim held focus. On macOS this
# needs Ghostty's macos-option-as-alt (set) and AeroSpace not claiming
# alt-hjkl (its focus keys are ctrl-alt-hjkl for that reason).
bind-key -n M-h resize-pane -L 3
bind-key -n M-j resize-pane -D 3
bind-key -n M-k resize-pane -U 3
bind-key -n M-l resize-pane -R 3

# C-l is taken by pane navigation, so clear-screen never reaches the shell.
# Put it back on the prefix.
bind C-l send-keys 'C-l'

# -- run tpm -------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'

# Auto-install: adding a `set -g @plugin' line above is all it takes. TPM's own
# instruction is `prefix + I', which is easy to forget and fails quietly -- the
# plugin simply never loads and nothing says why.
#
# install_plugins clones what is declared but missing, and does NOT source what
# it clones, so the config has to be re-read afterwards or a new plugin sits on
# disk inert. Re-read only when something was actually fetched: that is what
# makes this terminate rather than loop, since the second pass finds nothing
# missing. Costs at most one extra config load per newly added plugin, and a
# no-op run is ~35ms, backgrounded.
run -b '[ -x $HOME/.tmux/plugins/tpm/bin/install_plugins ] || exit 0; out=$($HOME/.tmux/plugins/tpm/bin/install_plugins); case "$out" in *"download success"*) tmux source-file $HOME/.tmux.conf;; esac'
